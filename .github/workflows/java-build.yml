name: Java Build

on:
  push:
    paths:
      - "java/**"
      - "tools/generate_story_audio.py"
      - ".github/workflows/java-build.yml"
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java-build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Install voice/audio tools
        run: sudo apt-get update && sudo apt-get install -y espeak ffmpeg
        working-directory: .
      - name: Generate Chapter 1 voice audio
        run: python3 ../tools/generate_story_audio.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle build --stacktrace --warning-mode all
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-story-java
          path: java/build/libs/*.jar
