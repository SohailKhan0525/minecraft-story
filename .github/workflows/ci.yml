name: CI — Build and test supported runtimes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java build — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build Java mod
        working-directory: java
        run: gradle build --stacktrace --warning-mode all

  bedrock:
    name: Bedrock validation — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check Bedrock script syntax
        run: node --check bedrock/behavior_packs/minecraft_story/scripts/main.js
      - name: Validate Bedrock packs
        run: python tools/validate_bedrock.py

  voice:
    name: Voice pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install open-source TTS/audio tools
        run: sudo apt-get update && sudo apt-get install -y espeak ffmpeg
      - name: Generate voices
        run: python tools/generate_story_audio.py
      - name: Validate repository consistency
        run: python tools/validate_repository.py
      - name: Generate voices
        run: python tools/generate_story_audio.py
      - name: Validate voices
        run: python tools/validate_voice_assets.py
