name: Audio and playable builds

on:
  push:
    branches: [main]
    paths:
      - "java/src/main/java/com/minecraftstory/story/Chapter1Content.java"
      - "tools/generate_story_audio.py"
      - "tools/package_bedrock_addon.py"
      - ".github/workflows/audio-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Install voice/audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg python3

      - name: Generate Chapter 1 voices
        run: python3 tools/generate_story_audio.py

      - name: Package Bedrock addon
        run: python3 tools/package_bedrock_addon.py

      - name: Build Java mod
        working-directory: java
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --warning-mode all

      - name: Upload playable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-story-chapter-1
          path: |
            java/build/libs/*.jar
            dist/*.mcaddon
            dist/*.zip

      - name: Commit generated voice assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add java/src/main/resources/assets/minecraftstory/sounds/voice
          git add bedrock/resource_packs/minecraft_story/sounds/minecraftstory/voice
          if git diff --cached --quiet; then
            echo "No generated voice changes to commit."
          else
            git commit -m "build: generate Chapter 1 voice assets [skip voice generation]"
            git push origin main
          fi
